# Render blueprint for the Django backend.
# Create the service in Render, then set MAPBOX_ACCESS_TOKEN and
# DJANGO_SECRET_KEY in the service's Environment tab.
services:
  - type: web
    name: spotter-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "" # set to your *.onrender.com host after first deploy
      - key: CORS_ALLOWED_ORIGINS
        value: "" # set to your Vercel frontend URL
      - key: MAPBOX_ACCESS_TOKEN
        sync: false # set manually in the dashboard
